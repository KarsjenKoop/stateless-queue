name: Bug report
description: Report something that does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** use this template for security
        vulnerabilities — follow [SECURITY.md](../blob/main/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal reproduction, ideally a failing test.
      placeholder: |
        1. Configure the `google` adapter with ...
        2. Push `App\Jobs\ExampleJob` ...
        3. The webhook responds with ...
    validations:
      required: true

  - type: dropdown
    id: adapter
    attributes:
      label: Adapter
      options:
        - google (Pub/Sub)
        - aws (SNS)
        - "null"
        - Not adapter-specific
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3.10"
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "11.9.2"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Exception message and stack trace
      description: Redact any credentials, bearer tokens, or signature values before pasting.
      render: text
