name: PHPUnit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        stability: [prefer-stable]
        include:
          - php: '8.1'
            laravel: '10.*'
            stability: prefer-lowest
        exclude:
          - php: '8.1'
            laravel: '11.*'
          - php: '8.1'
            laravel: '12.*'
          - php: '8.1'
            laravel: '13.*'
          - php: '8.2'
            laravel: '13.*'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: |
          # Composer 2.10 refuses by default to load any package with an
          # unresolved security advisory. Advisories have since been published
          # against every Laravel 10.x and 11.x release, and both branches are
          # EOL so the fixes (12.60+/13.10+) will not be backported — which
          # makes those matrix rows unresolvable on a default Composer.
          #
          # Scoped to CI on purpose: it is set here rather than in composer.json
          # so it never reaches anyone installing this package.
          composer config policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.laravel == '13.*' && '^11.0' || (matrix.laravel == '12.*' && '^10.0' || (matrix.laravel == '11.*' && '^9.0' || '^8.0')) }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit
